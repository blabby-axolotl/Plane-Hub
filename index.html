<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>✈️ Plane Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Space Grotesk",sans-serif;
    background:
    radial-gradient(circle at top,#1d4f7c,#0b1625 50%,#02060d);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    padding:40px;
}


.container{

    max-width:900px;
    padding:45px;
    text-align:center;

    background:rgba(255,255,255,.05);
    backdrop-filter:blur(18px);

    border-radius:28px;

    border:1px solid rgba(79,195,247,.25);

    box-shadow:
    0 0 40px rgba(79,195,247,.18);

}


h1{

    font-size:3rem;

    background:
    linear-gradient(90deg,#7dd3fc,#38bdf8,#7dd3fc);

    background-size:200%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:gradient 6s infinite linear;

    margin-bottom:25px;

}


@keyframes gradient{

    from{
        background-position:0%;
    }

    to{
        background-position:200%;
    }

}


h2{

    color:#d5eaff;
    font-size:1.3rem;
    font-weight:400;
    line-height:1.6;
    margin-bottom:25px;

}


h3{

    color:#7dd3fc;
    font-size:1.1rem;

}


.icon{

    font-size:70px;
    margin-bottom:20px;

}

</style>

</head>

<body>

<div class="container">

<div class="icon">✈️</div>

<h1>
Welcome to Plane Hub
</h1>

<h2>
A website where you can upload aircraft photos and automatically customise your bookmarks and ScriptView with your favourite aviation style.
</h2>

<h3>
🚧 Currently under development — new features are coming soon!
</h3>

</div>

</body>
</html>
