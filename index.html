<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plane Hub — Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Plane Hub (Prototype)</h1>
    <nav>
      <a href="index.html">Feed</a> |
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <section id="upload">
      <h2>Upload a plane photo</h2>
      <form id="uploadForm">
        <label>Display name: <input id="author" required></label>
        <label>Email: <input id="email" type="email" required></label>
        <label>Title: <input id="title" required></label>
        <label>Description:<br><textarea id="description"></textarea></label>
        <label>Image: <input id="file" type="file" accept="image/*,video/*" required></label>
        <div id="captchaWrap">
          <canvas id="captchaCanvas" width="150" height="50"></canvas>
          <button type="button" id="refreshCaptcha">Refresh</button>
        </div>
        <label>Enter captcha: <input id="captchaInput" required></label>
        <button type="submit">Upload (goes to admin approval)</button>
      </form>
      <p class="note">All uploads go into a pending queue for admin review. You will be notified locally when approved.</p>
    </section>

    <section id="feed">
      <h2>Approved posts</h2>
      <div id="posts"></div>
    </section>
  </main>

  <template id="postTemplate">
    <article class="post">
      <header>
        <h3 class="post-title"></h3>
        <div class="meta"><span class="author"></span> • <time class="time"></time></div>
      </header>
      <div class="media"></div>
      <p class="desc"></p>
      <div class="actions">
        <button class="likeBtn">Like (<span class="likeCount">0</span>)</button>
        <button class="followBtn">Follow</button>
        <button class="commentToggle">Comments</button>
      </div>
      <div class="comments" style="display:none;">
        <div class="commentList"></div>
        <input class="commentInput" placeholder="Write a comment..."><button class="commentSend">Send</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
